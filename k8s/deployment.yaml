apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-app
  namespace: apex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-app
  template:
    metadata:
      labels:
        app: apex-app
    spec:
      containers:
        - name: apex-app
          image: apexregistry001.azurecr.io/apex-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apex-db-secret
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
